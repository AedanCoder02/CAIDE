name: SEO check

# Builds the Cloudflare static export and runs scripts/seo-check.mjs on it.
# Make "SEO check / seo" a required status check so SEO regressions cannot merge.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cf
        env:
          NEXT_PUBLIC_SITE_URL: https://caide.agency
      - run: node scripts/seo-check.mjs
