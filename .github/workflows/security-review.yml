name: Security review

# Dedicated security pass on every PR, modelled on anthropics/claude-code-security-review.
# That action only accepts an Anthropic API key; CAIDE runs Claude through OAuth only, so the
# same audit runs here through claude-code-action with CLAUDE_CODE_OAUTH_TOKEN.
# HIGH findings fail this check. Make "Security review / security" a required status check.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a senior security engineer. Audit only the code this PR adds or changes
            (`gh pr diff`), reading surrounding files to confirm data flow. Report only vulnerabilities
            with a concrete, exploitable path; no theoretical issues, style, or hardening wishes.

            Check against the CAIDE security list:
            - injection: SQL built from strings, command injection, path traversal, SSRF, unsafe deserialization;
            - XSS: unescaped user input in HTML, dangerouslySetInnerHTML, javascript: URLs;
            - authn/authz: unprotected admin or API routes, permission checks only on the client,
              missing ownership checks (IDOR), session or token handling, tokens in localStorage;
            - secrets: keys or tokens in code, secrets reachable from client bundles (NEXT_PUBLIC_*), .env committed;
            - webhooks: handlers that act without verifying the provider signature;
            - input and uploads: missing validation of type, size or shape on request bodies and files;
            - data exposure: personal data, credentials or full payloads written to logs or error responses;
            - CORS wider than needed, debug or verbose error output enabled in production;
            - passwords stored or compared without a slow hash or constant-time comparison;
            - missing rate limits on login, form or expensive endpoints.

            Severity: HIGH = directly exploitable (auth bypass, injection, secret exposure, data leak).
            MEDIUM = exploitable under specific conditions. Skip anything lower.
            Post each finding as an inline comment with `mcp__github_inline_comment__create_inline_comment`
            (confirmed: true), starting with [SECURITY HIGH] or [SECURITY MEDIUM], with the exploit path
            and the fix. Post one `gh pr comment` summary only when there are findings.
            Return the counts in the structured output.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"high":{"type":"integer","minimum":0},"medium":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["high","medium","summary"]}'

      - name: Show why Claude failed
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # The action hides Claude's output, so a rejected token or API error shows up only as
          # "did not return structured_output". Print the run's final result message instead.
          jq -r '[.[] | select(.type == "result")] | last | "is_error=\(.is_error) api_error_status=\(.api_error_status) turns=\(.num_turns) cost=\(.total_cost_usd)\n\(.result // "no result text")"' "$EXEC_FILE" || cat "$EXEC_FILE" | head -c 2000

      - name: Gate on HIGH findings
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::error::The security review returned no result, so the PR is not cleared."
            exit 1
          fi
          HIGH=$(printf '%s' "$RESULT" | jq -r '.high')
          MEDIUM=$(printf '%s' "$RESULT" | jq -r '.medium')
          printf '%s' "$RESULT" | jq -r '.summary' >> "$GITHUB_STEP_SUMMARY"
          echo "High: $HIGH, medium: $MEDIUM"
          if [ "$HIGH" != "0" ]; then
            echo "::error::$HIGH HIGH security finding(s). Fix them and push to re-run."
            exit 1
          fi
